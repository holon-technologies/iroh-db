name: fuzz qualification

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Mutation seconds per target (1-18000)
        required: true
        default: "600"
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - commit_decode
          - sync_frame_decode
          - security_decode
          - state_decode
          - crdt_merge
    env:
      FUZZ_DURATION_SECONDS: ${{ inputs.duration_seconds || '600' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz
      - name: Validate mutation duration
        run: |
          case "$FUZZ_DURATION_SECONDS" in
            ""|*[!0-9]*|??????*)
              echo "duration_seconds must be an integer from 1 through 18000" >&2
              exit 2
              ;;
          esac
          if [ "$FUZZ_DURATION_SECONDS" -lt 1 ] || [ "$FUZZ_DURATION_SECONDS" -gt 18000 ]; then
            echo "duration_seconds must be an integer from 1 through 18000" >&2
            exit 2
          fi
      - name: Fuzz ${{ matrix.target }}
        run: >-
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} --
          -max_total_time=${FUZZ_DURATION_SECONDS} -timeout=10 -rss_limit_mb=4096
      - name: Retain corpus and crash evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30
