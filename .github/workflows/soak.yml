name: production soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Minimum wall-clock soak duration
        required: true
        default: "259200"
      restart_every:
        description: Completed rounds between durable peer restarts
        required: true
        default: "97"
      record_slots:
        description: Bounded live record slots per peer
        required: true
        default: "256"
      max_rss_anon_kib:
        description: Fail-closed anonymous RSS budget in KiB
        required: true
        default: "262144"
      min_round_millis:
        description: Minimum duration of each qualification round
        required: true
        default: "1000"
      operation_timeout_seconds:
        description: Deadline for each lifecycle or sync operation
        required: true
        default: "30"
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

concurrency:
  group: production-soak
  cancel-in-progress: false

jobs:
  churn:
    # GitHub-hosted jobs cannot run for 72 hours. Qualification runners must
    # deliberately carry this label and retain enough disk for three stores.
    runs-on: [self-hosted, linux, x64, iroh-db-soak]
    timeout-minutes: 4380
    env:
      IROH_DB_SOAK_DURATION_SECS: ${{ inputs.duration_seconds || '259200' }}
      IROH_DB_SOAK_RESTART_EVERY: ${{ inputs.restart_every || '97' }}
      IROH_DB_SOAK_RECORD_SLOTS: ${{ inputs.record_slots || '256' }}
      IROH_DB_SOAK_MAX_RSS_ANON_KIB: ${{ inputs.max_rss_anon_kib || '262144' }}
      IROH_DB_SOAK_MIN_ROUND_MILLIS: ${{ inputs.min_round_millis || '1000' }}
      IROH_DB_SOAK_OPERATION_TIMEOUT_SECS: ${{ inputs.operation_timeout_seconds || '30' }}
      IROH_DB_SOAK_METRICS_PATH: iroh-db-soak-metrics.tsv
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Run exact-duration partition/reconnect/restart soak
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p iroh-db-testkit --test churn extended_partition_reconnect_soak -- --ignored --exact --nocapture 2>&1 | tee iroh-db-soak.log
      - name: Retain qualification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroh-db-soak-${{ github.run_id }}
          path: |
            iroh-db-soak.log
            iroh-db-soak-metrics.tsv
          if-no-files-found: error
          retention-days: 90
